<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sky Strike 2D - Mobile & PC</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #050b14;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 800px;
            max-height: 600px;
            border: 2px solid #00d2ff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
            overflow: hidden;
            background: #020813;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        /* Menu Utama Overlay */
        #menu-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 11, 20, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
            text-align: center;
        }
        #menu-overlay h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #00f2fe;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
            letter-spacing: 2px;
        }
        #menu-overlay p {
            color: #aaa;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 80%;
            max-width: 250px;
        }
        
        /* UI Overlay saat Main */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 10px 15px;
            pointer-events: none;
            display: none;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0,0,0,0.9);
            z-index: 5;
        }
        .p1-color { color: #00f2fe; }
        .p2-color { color: #ff0844; }

        /* Kontrol Sentuh HP (Mobile Overlay) */
        #mobile-controls {
            position: absolute;
            bottom: 15px; left: 0; width: 100%;
            height: 140px;
            display: none;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: auto;
            z-index: 10;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 45px);
            grid-template-rows: repeat(3, 45px);
            gap: 3px;
        }
        .touch-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            active-background: rgba(0, 242, 254, 0.4);
        }
        .touch-btn:active {
            background: rgba(0, 242, 254, 0.5);
        }
        .fire-btn {
            width: 75px; height: 75px;
            border-radius: 50%;
            background: rgba(255, 8, 68, 0.4);
            border: 2px solid #ff0844;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            align-self: flex-end;
            margin-bottom: 10px;
        }
        .fire-btn:active {
            background: rgba(255, 8, 68, 0.8);
        }

        /* Screen Game Over */
        #game-over {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(5, 11, 20, 0.95);
            border: 1px solid #00d2ff;
            padding: 25px 30px;
            border-radius: 12px;
            display: none;
            z-index: 20;
            width: 80%;
            max-width: 300px;
        }
        #game-over h2 {
            margin-top: 0;
            color: #ff0844;
        }
        button {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(45deg, #0078D7, #00f2fe);
            color: white;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <!-- Menu Pilih Mode -->
    <div id="menu-overlay">
        <h1>SKY STRIKE 2D</h1>
        <p>Pilih Mode Permainan:</p>
        <div class="btn-group">
            <button onclick="startGame(1)">1 PEMAIN (SOLO)</button>
            <button onclick="startGame(2)">2 PEMAIN (CO-OP)</button>
        </div>
        <div style="margin-top: 25px; font-size: 12px; color: #888;">
            PC: W,A,S,D / Panah + Spasi<br>
            HP: Gunakan Tombol Layar Sentuh
        </div>
    </div>

    <!-- UI Overlay saat Gameplay -->
    <div id="ui-layer">
        <div>
            <div class="p1-color" id="p1-ui">P1: <span id="score1">0</span></div>
            <div class="p2-color" id="p2-ui">P2: <span id="score2">0</span></div>
        </div>
        <div style="text-align: center;">
            <div style="color: #ffd700;">LVL <span id="level-display">1</span></div>
            <div id="time-display">00:00</div>
        </div>
    </div>

    <!-- Kontrol Sentuh HP -->
    <div id="mobile-controls">
        <div class="dpad">
            <div></div>
            <div class="touch-btn" id="btn-up">▲</div>
            <div></div>
            <div class="touch-btn" id="btn-left">◄</div>
            <div></div>
            <div class="touch-btn" id="btn-right">►</div>
            <div></div>
            <div class="touch-btn" id="btn-down">▼</div>
            <div></div>
        </div>
        <div class="touch-btn fire-btn" id="btn-fire">FIRE</div>
    </div>

    <!-- Screen Game Over -->
    <div id="game-over">
        <h2>GAME OVER</h2>
        <p>Waktu: <span id="final-time">00:00</span></p>
        <button onclick="location.reload()">Menu Utama</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'shoot') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'explode') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.25);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
        } else if (type === 'levelup') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.setValueAtTime(600, now + 0.15);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
    }

    // Input Handlers (PC & Mobile)
    const keys = {};
    const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Bintang Background
    const stars = Array.from({ length: 50 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 1,
        speed: Math.random() * 3 + 1
    }));

    let isGameOver = false;
    let gameStarted = false;
    let gameMode = 1;
    let level = 1;
    let gameTime = 0;
    let frames = 0;

    class Player {
        constructor(x, y, color, controls, id) {
            this.x = x; this.y = y;
            this.width = 36; this.height = 44;
            this.color = color;
            this.speed = 5;
            this.controls = controls;
            this.id = id;
            this.score = 0;
            this.lastShot = 0;
            this.isDead = false;
        }

        draw() {
            if (this.isDead) return;

            ctx.save();
            ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

            ctx.fillStyle = (frames % 6 < 3) ? '#ff9900' : '#ff3300';
            ctx.beginPath();
            ctx.moveTo(-6, this.height / 2);
            ctx.lineTo(6, this.height / 2);
            ctx.lineTo(0, this.height / 2 + 10 + (Math.random() * 4));
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2);
            ctx.lineTo(this.width / 2, this.height / 2);
            ctx.lineTo(8, this.height / 3);
            ctx.lineTo(-8, this.height / 3);
            ctx.lineTo(-this.width / 2, this.height / 2);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(0, -5, 4, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        update() {
            if (this.isDead) return;

            if (keys[this.controls.up] && this.y > 0) this.y -= this.speed;
            if (keys[this.controls.down] && this.y < canvas.height - this.height) this.y += this.speed;
            if (keys[this.controls.left] && this.x > 0) this.x -= this.speed;
            if (keys[this.controls.right] && this.x < canvas.width - this.width) this.x += this.speed;

            if (keys[this.controls.shoot] && frames - this.lastShot > 14) {
                bullets.push(new Bullet(this.x + this.width / 2, this.y, -9, this.color, this.id));
                this.lastShot = frames;
                playSound('shoot');
            }
        }
    }

    class Bullet {
        constructor(x, y, speedY, color, ownerId) {
            this.x = x; this.y = y;
            this.radius = 3;
            this.speedY = speedY;
            this.color = color;
            this.ownerId = ownerId;
            this.active = true;
        }
        draw() {
            ctx.save();
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
        update() {
            this.y += this.speedY;
            if (this.y < -10 || this.y > canvas.height + 10) this.active = false;
        }
    }

    class Enemy {
        constructor() {
            this.width = 34; this.height = 36;
            this.x = Math.random() * (canvas.width - this.width);
            this.y = -this.height;
            this.speed = Math.random() * 1.5 + 1.5 + (level * 0.4);
            this.active = true;
            this.hp = level;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

            ctx.fillStyle = '#ff3333';
            ctx.beginPath();
            ctx.moveTo(0, this.height / 2);
            ctx.lineTo(this.width / 2, -this.height / 2);
            ctx.lineTo(0, -this.height / 4);
            ctx.lineTo(-this.width / 2, -this.height / 2);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#990000';
            ctx.fillRect(-6, -this.height / 3, 12, 6);

            ctx.restore();
        }
        update() {
            this.y += this.speed;
            if (this.y > canvas.height + 20) this.active = false;
        }
    }

    let players = [];
    let bullets = [];
    let enemies = [];
    let particles = [];

    // Pengaturan Tombol Layar Sentuh HP
    function setupTouchControls() {
        if (isMobile) {
            document.getElementById('mobile-controls').style.display = 'flex';
            
            const bindTouch = (btnId, keyName) => {
                const btn = document.getElementById(btnId);
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            };

            bindTouch('btn-up', 'KeyW');
            bindTouch('btn-down', 'KeyS');
            bindTouch('btn-left', 'KeyA');
            bindTouch('btn-right', 'KeyD');
            bindTouch('btn-fire', 'Space');
        }
    }

    function startGame(mode) {
        gameMode = mode;
        gameStarted = true;

        document.getElementById('menu-overlay').style.display = 'none';
        document.getElementById('ui-layer').style.display = 'flex';

        setupTouchControls();

        if (gameMode === 1) {
            players = [
                new Player(380, 500, '#00f2fe', {up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', shoot: 'Space'}, 1)
            ];
            document.getElementById('p2-ui').style.display = 'none';
        } else {
            players = [
                new Player(250, 500, '#00f2fe', {up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', shoot: 'Space'}, 1),
                new Player(510, 500, '#ff0844', {up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', shoot: 'Enter'}, 2)
            ];
            document.getElementById('p2-ui').style.display = 'block';
        }

        gameLoop();
    }

    function createExplosion(x, y, color) {
        playSound('explode');
        for (let i = 0; i < 14; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                size: Math.random() * 4 + 2,
                life: 25,
                color: color
            });
        }
    }

    function checkCollision(r1, r2) {
        return (r1.x < r2.x + r2.width &&
                r1.x + r1.width > r2.x &&
                r1.y < r2.y + r2.height &&
                r1.y + r1.height > r2.y);
    }

    function gameLoop() {
        if (isGameOver || !gameStarted) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frames++;

        ctx.fillStyle = '#ffffff';
        stars.forEach(star => {
            star.y += star.speed;
            if (star.y > canvas.height) star.y = 0;
            ctx.fillRect(star.x, star.y, star.size, star.size);
        });

        if (frames % 60 === 0) {
            gameTime++;
            const mins = String(Math.floor(gameTime / 60)).padStart(2, '0');
            const secs = String(gameTime % 60).padStart(2, '0');
            document.getElementById('time-display').innerText = `${mins}:${secs}`;

            if (gameTime % 20 === 0) {
                level++;
                document.getElementById('level-display').innerText = level;
                playSound('levelup');
            }
        }

        const spawnInterval = Math.max(18, 55 - (level * 4));
        if (frames % spawnInterval === 0) {
            enemies.push(new Enemy());
        }

        players.forEach(p => { p.update(); p.draw(); });

        bullets.forEach(b => { b.update(); b.draw(); });
        bullets = bullets.filter(b => b.active);

        enemies.forEach(enemy => {
            enemy.update();
            enemy.draw();

            bullets.forEach(b => {
                if (b.active && enemy.active &&
                    b.x > enemy.x && b.x < enemy.x + enemy.width &&
                    b.y > enemy.y && b.y < enemy.y + enemy.height) {
                    
                    b.active = false;
                    enemy.hp--;
                    if (enemy.hp <= 0) {
                        enemy.active = false;
                        createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#ff9900');
                        
                        const p = players.find(player => player.id === b.ownerId);
                        if (p) {
                            p.score += 10 * level;
                            document.getElementById(`score${p.id}`).innerText = p.score;
                        }
                    }
                }
            });

            players.forEach(p => {
                if (!p.isDead && enemy.active && checkCollision(p, enemy)) {
                    createExplosion(p.x + p.width / 2, p.y + p.height / 2, p.color);
                    p.isDead = true;
                    enemy.active = false;
                }
            });
        });
        enemies = enemies.filter(e => e.active);

        particles.forEach((p, idx) => {
            p.x += p.vx; p.y += p.vy; p.life--;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
            if (p.life <= 0) particles.splice(idx, 1);
        });

        if (players.every(p => p.isDead)) {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('mobile-controls').style.display = 'none';
            document.getElementById('final-time').innerText = document.getElementById('time-display').innerText;
        } else {
            requestAnimationFrame(gameLoop);
        }
    }
</script>
</body>
</html>
